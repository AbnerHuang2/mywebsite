theme = "congo"

# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://skitii.vercel.app/"
defaultContentLanguage = "en"
hasCJKLanguage = true

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]


[taxonomies]
  tag = "tags"
  category = "categories"


[params.utterances]
  enable = true
  repo = "AbnerHuang2/mywebsite" ##换成自己的仓库
  issueTerm = "pathname"
  theme = "github-light"
