<!-- PlantUML 图表样式 -->
<style>
.plantuml-diagram {
  text-align: center;
  margin: 2rem 0;
  overflow-x: auto;
}

.plantuml-diagram img {
  max-width: 100%;
  height: auto;
  display: inline-block;
}

.plantuml-loading {
  color: #6c757d;
  padding: 2rem;
  text-align: center;
}

/* 深色模式适配 */
@media (prefers-color-scheme: dark) {
  .plantuml-diagram img {
    filter: invert(0.9) hue-rotate(180deg);
  }
}
</style>
